version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: widget_user
      POSTGRES_PASSWORD: widget_pass
      POSTGRES_DB: widget_platform
    ports:
      - "5432:5432"
    volumes:
      - widget_pg_data:/var/lib/postgresql/data

volumes:
  widget_pg_data:
